<style>

      --ground:#131519; --surface:#1b1e24; --surface-2:#23272f;
      --ink:#e7e8ea; --ink-muted:#9aa1ad; --ink-faint:#6b7280;
      --line:#2e333c; --line-strong:#3b414c;
      --accent:#7f9ff3; --accent-soft:#26314c;
      --good:#65b98a;   --good-soft:#1e2f26;
      --warn:#d6a24a;   --warn-soft:#332a1a;
      --bad:#e0837a;    --bad-soft:#3a2420;
      --c-ingreso:#7f9ff3; --c-gasto:#e08a5c; --c-ahorro:#65b98a; --c-grid:#2e333c;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 1px 3px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --ground:#131519; --surface:#1b1e24; --surface-2:#23272f;
    --ink:#e7e8ea; --ink-muted:#9aa1ad; --ink-faint:#6b7280;
    --line:#2e333c; --line-strong:#3b414c;
    --accent:#7f9ff3; --accent-soft:#26314c;
    --good:#65b98a;   --good-soft:#1e2f26;

  /* ============ base ============ */

  h1,h2,h3{font-family:"Archivo", ui-sans-serif, system-ui, sans-serif; margin:0; text-wrap:balance; letter-spacing:-.01em}

  /* ============ top bar ============ */
  .topbar{position:sticky; top:0; z-index:30;
    display:flex; align-items:center; gap:1.1rem; flex-wrap:wrap;
    padding:.7rem 1.5rem;

    backdrop-filter:blur(8px); border-bottom:1px solid var(--line);}
  .brand{display:flex; align-items:center; gap:.55rem; font-family:"Archivo"; font-weight:700; font-size:1rem; letter-spacing:-.02em; white-space:nowrap}
  .brand .glyph{width:26px; height:26px; border-radius:7px; background:var(--accent); color:#fff;

  :root[data-theme="dark"] .brand .glyph, :root:not([data-theme="light"]) .brand .glyph{color:#131519}
  .tabs{display:flex; gap:.15rem; flex-wrap:wrap; flex:1 1 320px}

  .icon-btn{border:1px solid var(--line-strong); background:var(--surface); color:var(--ink-muted); width:32px; height:32px; border-radius:8px; display:grid; place-items:center}

  /* ============ layout ============ */
  main{max-width:1180px; margin:0 auto; padding:1.5rem}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:13px; padding:1.05rem 1.15rem; box-shadow:var(--shadow)}

  /* ============ badges ============ */

  .badge.grey{background:var(--surface-2); color:var(--ink-muted)}
  .badge.blue{background:var(--accent-soft); color:var(--accent)}
  .badge.good{background:var(--good-soft); color:var(--good)}
  .badge.warn{background:var(--warn-soft); color:var(--warn)}
  .badge.bad{background:var(--bad-soft); color:var(--bad)}

  .ico{display:inline-flex; color:var(--ink-faint)}

  .chips{display:inline-flex; gap:.3rem; align-items:center}

  /* semáforo */
  .lights{display:inline-flex; gap:.28rem; align-items:center; vertical-align:middle}
  .lights i{width:9px; height:9px; border-radius:50%; background:var(--surface-2); display:inline-block}

  .lights.warn i:nth-child(2){background:var(--warn)}

  /* ============ meter ============ */
  .meter{height:8px; border-radius:999px; background:var(--surface-2); overflow:hidden}

  .meter > i.good{background:var(--good)} .meter > i.warn{background:var(--warn)} .meter > i.bad{background:var(--bad)}
  .meter-row{display:grid; gap:.35rem}

  .meter-row .ln .r{font-family:"IBM Plex Mono"; color:var(--ink-muted)}

  /* ============ forms ============ */
  form{display:grid; gap:.8rem}
  .field{display:grid; gap:.3rem}
  .field > label{font-size:.72rem; font-weight:600; color:var(--ink-muted)}
  input,select{width:100%; padding:.5rem .6rem; border:1px solid var(--line-strong); border-radius:8px;

  .toggle2{display:inline-flex; border:1px solid var(--line-strong); border-radius:8px; overflow:hidden}

  .checks{display:flex; gap:1.1rem; flex-wrap:wrap; padding-top:.1rem}
  .check{display:flex; align-items:center; gap:.45rem; font-size:.82rem}

  .btn{border:1px solid transparent; background:var(--accent); color:#fff; padding:.55rem .9rem; border-radius:8px; font-weight:600; font-size:.85rem}

  .btn.ghost{background:transparent; border-color:var(--line-strong); color:var(--ink-muted)}

  .btn.sm{padding:.4rem .65rem; font-size:.78rem}
  .link-btn{border:0; background:transparent; color:var(--accent); font-size:.78rem; font-weight:600; padding:.1rem .2rem}
  .toolbar{display:flex; gap:.6rem; flex-wrap:wrap; align-items:center; justify-content:space-between}

  /* ============ charts ============ */
  .legend{display:flex; gap:1rem; flex-wrap:wrap; font-size:.76rem; color:var(--ink-muted); margin-bottom:.7rem}
  .legend span{display:inline-flex; align-items:center; gap:.35rem}

  .barlist{display:grid; gap:.6rem}
  .barlist .b{display:grid; grid-template-columns:130px 1fr auto; align-items:center; gap:.7rem; font-size:.8rem}
  .barlist .b .track{height:14px; background:var(--surface-2); border-radius:4px; overflow:hidden}
  .barlist .b .track > i{display:block; height:100%; background:var(--accent); border-radius:0 4px 4px 0}
  .barlist .b .val{font-family:"IBM Plex Mono"; color:var(--ink-muted); font-size:.78rem}
  .barlist .b .lbl{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .chart-svg{width:100%; height:auto; display:block; overflow:visible}
  .chart-hold{position:relative}
  .tip{position:absolute; pointer-events:none; opacity:0; transition:opacity .12s;
    background:var(--ink); color:var(--ground); font-size:.74rem; padding:.4rem .55rem; border-radius:7px;
    transform:translate(-50%,-115%); white-space:nowrap; z-index:5; box-shadow:var(--shadow);}

  /* ============ misc ============ */
  .kv{display:grid; grid-template-columns:auto 1fr; gap:.4rem 1rem; font-size:.82rem}
  .kv dt{color:var(--ink-muted)}
  .kv dd{margin:0; font-family:"IBM Plex Mono"; text-align:right}
  .profile{display:flex; gap:.9rem; align-items:flex-start}
  .avatar{width:44px; height:44px; border-radius:50%; display:grid; place-items:center; font-family:"Archivo"; font-weight:700; font-size:1.05rem; flex:none}
  .avatar.h{background:var(--accent-soft); color:var(--accent)}
  .avatar.p{background:var(--good-soft); color:var(--good)}
  .note{font-size:.78rem; color:var(--ink-muted); display:flex; gap:.5rem; align-items:flex-start; margin:.2rem 0 0}
  .note svg{width:15px; height:15px; flex:none; margin-top:.1rem; color:var(--ink-faint)}
  .toast{position:fixed; right:1.25rem; bottom:1.25rem; z-index:60;
    background:var(--ink); color:var(--ground); padding:.7rem .95rem; border-radius:9px;
    font-size:.82rem; box-shadow:var(--shadow); opacity:0; transform:translateY(8px); transition:opacity .18s, transform .18s;}

  .mockbar{text-align:center; font-size:.74rem; color:var(--ink-muted); background:var(--surface-2); padding:.3rem; border-bottom:1px solid var(--line);}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
/* =================== cotizaciones (fuente única) =================== */
const COT = { USD_ARS:1470, BTC_USD:62000, fecha:'01/09/2026' };
const BTC_ARS = () => COT.BTC_USD * COT.USD_ARS;               // ≈ 91.140.000
const nf = new Intl.NumberFormat('es-AR');
function money(v, m='ARS'){
  if(m==='USD') return 'US$ ' + nf.format(Math.round(v));
  if(m==='BTC') return '₿ ' + v.toLocaleString('es-AR',{minimumFractionDigits:4, maximumFractionDigits:6});
  return '$ ' + nf.format(Math.round(v));
}
function toARS(v,m){
  if(m==='USD') return v*COT.USD_ARS;
  if(m==='BTC') return v*BTC_ARS();
  return v;
}

/* =================== ingresos y egresos (dinero común del hogar) =================== */
const CONCEPTOS = [
  {n:'Sueldo Hernan',        tipo:'ingreso', cat:'Sueldos',    mon:'ARS', monto:1850000, rec:true,  grp:false, cuenta:'Cuenta sueldo Galicia',   estado:'pagado'},
  {n:'Sueldo Xime',          tipo:'ingreso', cat:'Sueldos',    mon:'ARS', monto:1420000, rec:true,  grp:false, cuenta:'Cuenta sueldo Santander', estado:'pagado'},
  {n:'Renta depto Córdoba',  tipo:'ingreso', cat:'Inversiones',mon:'USD', monto:320,     rec:true,  grp:false, cuenta:'Caja de ahorro USD',      estado:'pagado'},
  {n:'Otros ingresos',       tipo:'ingreso', cat:'Varios',     mon:'ARS', monto:95000,   rec:false, grp:false, cuenta:'Efectivo Hernan',         estado:'pendiente'},

  {n:'Alquiler',             tipo:'gasto', cat:'Vivienda',     mon:'ARS', monto:650000, rec:true,  grp:false, cuenta:'Cuenta sueldo Galicia',   estado:'pagado'},
  {n:'Expensas',             tipo:'gasto', cat:'Vivienda',     mon:'ARS', monto:118000, rec:true,  grp:false, cuenta:'Cuenta sueldo Galicia',   estado:'pagado'},
  {n:'Luz, gas y agua',      tipo:'gasto', cat:'Vivienda',     mon:'ARS', monto:96000,  rec:true,  grp:false, cuenta:'Cuenta sueldo Santander', estado:'pagado'},
  {n:'Internet y cable',     tipo:'gasto', cat:'Vivienda',     mon:'ARS', monto:28000,  rec:true,  grp:false, cuenta:'Tarjeta Visa',            estado:'pagado'},
  {n:'Colegio de los chicos',tipo:'gasto', cat:'Educación',    mon:'ARS', monto:240000, rec:true,  grp:false, cuenta:'Cuenta sueldo Santander', estado:'pagado'},
  {n:'Obra social',          tipo:'gasto', cat:'Salud',        mon:'ARS', monto:145000, rec:true,  grp:false, cuenta:'Cuenta sueldo Galicia',   estado:'pagado'},
  {n:'Farmacia',             tipo:'gasto', cat:'Salud',        mon:'ARS', monto:42000,  rec:false, grp:false, cuenta:'Efectivo Xime',           estado:'pagado'},
  {n:'Nafta',                tipo:'gasto', cat:'Transporte',   mon:'ARS', monto:110000, rec:false, grp:false, cuenta:'Efectivo Hernan',         estado:'pendiente'},
  {n:'Supermercado',         tipo:'gasto', cat:'Supermercado', mon:'ARS', monto:320000, rec:false, grp:false, cuenta:'Cuenta sueldo Santander', estado:'pendiente'},
  {n:'Gimnasio',             tipo:'gasto', cat:'Ocio y salud', mon:'ARS', monto:38000,  rec:true,  grp:false, cuenta:'Tarjeta Visa',            estado:'pagado'},
  {n:'Streaming (Netflix, Spotify)', tipo:'gasto', cat:'Ocio y salud', mon:'ARS', monto:14500, rec:true, grp:false, cuenta:'Tarjeta Visa',      estado:'pagado'},
  {n:'Tarjeta',              tipo:'gasto', cat:'Tarjeta',      mon:'ARS', monto:780000, rec:true,  grp:true,  cuenta:'Tarjeta Visa',            estado:'pendiente'},
];
const ingresosMes = () => CONCEPTOS.filter(c=>c.tipo==='ingreso').reduce((a,c)=>a+toARS(c.monto,c.mon),0);
const gastosMes   = () => CONCEPTOS.filter(c=>c.tipo==='gasto').reduce((a,c)=>a+toARS(c.monto,c.mon),0);

/* =================== evolución (12 meses) =================== */
const MESES12 = ['oct','nov','dic','ene','feb','mar','abr','may','jun','jul','ago','sep'];
const EVOL_ING = [2650000,2700000,3050000,2820000,2900000,3180000,3260000,3400000,3520000,3610000,3740000,3835400];
const EVOL_GAS = [2180000,2320000,2610000,2400000,2250000,2480000,2530000,2470000,2680000,2410000,2590000,2581500];
const EVOL_AHORRO = EVOL_ING.map((v,i)=>v-EVOL_GAS[i]);
const EVOL_ACUM = EVOL_AHORRO.reduce((acc,v)=>{ acc.push((acc.at(-1)||0)+v); return acc; },[]);
const AHORRO_ACUM = EVOL_ACUM.at(-1);

/* =================== presupuesto de efectivo (5% de ingresos) =================== */
const EFECTIVO = [
  {quien:'Hernan', asignado:110000, saldo:30000},
  {quien:'Xime',   asignado:82000,  saldo:6000},
];

/* =================== cuentas =================== */
const CUENTAS = [
  {n:'Cuenta sueldo Galicia',   tipo:'Caja de ahorro',     titular:'Hernan',     proposito:'Gastos del mes',        mon:'ARS', saldo:430000},
  {n:'Cuenta sueldo Santander', tipo:'Cuenta sueldo',      titular:'Xime',       proposito:'Gastos del mes',        mon:'ARS', saldo:512000},
  {n:'Efectivo Hernan',         tipo:'Billetera efectivo', titular:'Hernan',     proposito:'Gastos en efectivo del mes', mon:'ARS', saldo:30000},
  {n:'Efectivo Xime',           tipo:'Billetera efectivo', titular:'Xime',       proposito:'Gastos en efectivo del mes', mon:'ARS', saldo:6000},
  {n:'Caja de ahorro USD',      tipo:'Caja de ahorro',     titular:'Hernan',     proposito:'Ahorro / metas',        mon:'USD', saldo:2400},
  {n:'Fondo (plazo fijo)',      tipo:'Inversión',          titular:'Compartida', proposito:'Fondo de emergencia',   mon:'ARS', saldo:1680000},
  {n:'Reserva BTC',             tipo:'Billetera cripto',   titular:'Compartida', proposito:'Ahorro largo plazo',    mon:'BTC', saldo:0.045},
  {n:'Tarjeta Visa',            tipo:'Tarjeta de crédito', titular:'Compartida', proposito:'Gastos del mes (a pagar)', mon:'ARS', saldo:-780000},
];
const PROP_MES    = ['Gastos del mes','Gastos en efectivo del mes'];
const PROP_AHORRO = ['Ahorro / metas','Fondo de emergencia','Ahorro largo plazo'];

/* =================== metas =================== */
const HOY = '2026-09';
const MES3 = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const fmtMes = s => { const [y,m]=s.split('-').map(Number); return MES3[m-1]+' '+y; };
const mesesEntre = (a,b) => { const [ay,am]=a.split('-').map(Number),[by,bm]=b.split('-').map(Number); return (by-ay)*12+(bm-am); };
const METAS = [

/* =================== helpers DOM =================== */
const $ = (s,el=document)=>el.querySelector(s);
const el = (tag,cls,html)=>{const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e;};
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),2400); }
function head(title,desc){ const h=el('div','screen-head'); h.append(el('div',null,`<h1>${title}</h1><p>${desc}</p>`)); return h; }
function card(title,meta){ const c=el('div','card'); const h=el('div','card-head'); h.append(el('h2',null,title||'')); if(meta!=null) h.append(el('span','meta',meta)); c.append(h); return c; }
function statCard(label,n,d,dir){ const c=el('div','card'); c.append(el('div','stat',`<span class="l">${label}</span><span class="n">${n}</span>${d?`<span class="d ${dir||''}">${d}</span>`:''}`)); return c; }
function legend(items){ const l=el('div','legend'); items.forEach(([t,c])=>l.append(el('span',null,`<i style="background:${c}"></i>${t}`))); return l; }
const semaforo = pct => pct>90 ? 'bad' : pct>=70 ? 'warn' : 'good';
const lights = state => `<span class="lights ${state}"><i></i><i></i><i></i></span>`;

/* =================== PANTALLAS =================== */
const SCREENS = {};

/* ---------- Dashboard ---------- */
SCREENS.dashboard = () => {
  const wrap = el('section','screen');
  const ing = ingresosMes(), gas = gastosMes(), ahorro = ing-gas;
  wrap.append(head('Dashboard','Cómo viene el mes y cómo evoluciona el ahorro del hogar. Todos los montos en pesos, con las cotizaciones de la solapa Cotizaciones.'));

  const tiles = el('div','grid-4');
  tiles.append(
    statCard('Ingresos del mes', money(ing)),
    statCard('Gastos del mes', money(gas)),
    statCard('Ahorro del mes', '+ '+money(ahorro), (ahorro/ing*100).toFixed(0)+'% de los ingresos','up'),
    statCard('Ahorro acumulado', money(AHORRO_ACUM), '+ '+money(ahorro)+' este mes','up'),
  );
  wrap.append(tiles);

  const mid = el('div','grid-2');
  // gastos por categoría
  const cats = {};
  CONCEPTOS.filter(c=>c.tipo==='gasto').forEach(c=>{ cats[c.cat]=(cats[c.cat]||0)+toARS(c.monto,c.mon); });
  const rows = Object.entries(cats).sort((a,b)=>b[1]-a[1]);
  const max = rows[0][1];
  const cCard = card('Gastos por categoría', rows.length+' categorías');
  const bl = el('div','barlist');
  rows.forEach(([k,v])=>{
    const b=el('div','b');
    const tr=el('div','track'); const i=el('i',null,''); i.style.width=(v/max*100).toFixed(1)+'%'; tr.append(i);
    b.append(el('span','lbl',k), tr, el('span','val',money(v)));
    bl.append(b);
  });
  cCard.append(bl);
  mid.append(cCard);

  // evolución del ahorro acumulado
  const aCard = card('Evolución del ahorro acumulado','últimos 12 meses');
  aCard.append(areaChart(MESES12, EVOL_ACUM, 'var(--c-ahorro)'));
  mid.append(aCard);
  wrap.append(mid);

  // ingresos vs gastos (full width)
  const eCard = card('Ingresos vs. gastos','últimos 12 meses');
  eCard.append(legend([['Ingresos','var(--c-ingreso)'],['Gastos','var(--c-gasto)']]));
  eCard.append(lineChart(MESES12, EVOL_ING, EVOL_GAS));
  wrap.append(eCard);
  return wrap;
};

/* ---------- Presupuesto ---------- */
SCREENS.presupuesto = () => {
  const wrap = el('section','screen');
  const ing = ingresosMes();
  const objetivo = ing*0.05;
  const asignadoTot = EFECTIVO.reduce((a,e)=>a+e.asignado,0);
  const gastadoTot = EFECTIVO.reduce((a,e)=>a+(e.asignado-e.saldo),0);
  wrap.append(head('Presupuesto de efectivo','El gasto en efectivo del hogar entre los dos debería rondar el 5% de los ingresos del mes. Cada billetera se controla con un semáforo. El gasto se deduce del saldo que cargás en “Cuentas y perfiles”.'));

  const tiles = el('div','grid-3');
  tiles.append(
    statCard('Objetivo (5% de ingresos)', money(objetivo), 'sobre '+money(ing)+' de ingresos'),
    statCard('Asignado a las 2 billeteras', money(asignadoTot), (asignadoTot/ing*100).toFixed(1).replace('.',',')+'% de los ingresos'),
    statCard('Gastado a la fecha', money(gastadoTot), Math.round(gastadoTot/asignadoTot*100)+'% de lo asignado', gastadoTot/asignadoTot>0.9?'down':''),
  );
  wrap.append(tiles);

  const c = card('Billeteras de efectivo', 'semáforo: verde hasta 70% · amarillo 70–90% · rojo +90%');
  const grid = el('div','meter-row'); grid.style.gap='1.15rem';
  EFECTIVO.forEach(e=>{
    const gastado = e.asignado - e.saldo;
    const pct = gastado/e.asignado*100;
    const st = semaforo(pct);
    const r = el('div','meter-row');
    r.append(el('div','ln',
      `<span>${lights(st)} <strong>Efectivo ${e.quien}</strong> <span class="badge ${st} dot">${Math.round(pct)}%</span></span>`+
      `<span class="r">gastó ${money(gastado)} de ${money(e.asignado)}</span>`));
    const m=el('div','meter'); const i=el('i',st); i.style.width=Math.min(pct,100)+'%'; m.append(i); r.append(m);
    r.append(el('div',null,`<div class="t-sub" style="margin-top:.15rem">Saldo actual de la billetera: <span class="num">${money(e.saldo)}</span> · <button class="link-btn" data-go="cuentas">Actualizar saldo →</button></div>`));
    grid.append(r);
  });
  c.append(grid);
  c.append(el('p','note',`${IC.info}<span>Gastado = <span class="num">asignado − saldo actual</span>. Cuando actualizás el saldo de la billetera en Cuentas, el semáforo se mueve solo.</span>`));
  wrap.append(c);
  wrap.querySelectorAll('[data-go="cuentas"]').forEach(b=>b.addEventListener('click',()=>show('cuentas')));
  return wrap;
};

    const pct = m.acum/m.obj*100;

      <dt>Desde</dt><dd>${fmtMes(m.inicio)}</dd>

    grid.append(c);

/* ---------- Mes en curso ---------- */
SCREENS.mescurso = () => {
  const wrap = el('section','screen');
  wrap.append(head('Mes en curso — septiembre 2026','Los conceptos recurrentes ya vienen cargados cada mes. Marcá cada uno como pagado o pendiente y, cuando termine el mes, cerralo para abrir el siguiente.'));

  const total = CONCEPTOS.filter(c=>c.tipo==='gasto').reduce((a,c)=>a+toARS(c.monto,c.mon),0);
  const pagado = CONCEPTOS.filter(c=>c.tipo==='gasto'&&c.estado==='pagado').reduce((a,c)=>a+toARS(c.monto,c.mon),0);
  const pend = total-pagado;

  const tiles = el('div','grid-4');
  tiles.append(
    statCard('Período', 'sep 2026', 'mes abierto'),
    statCard('Gastos del mes', money(total)),
    statCard('Pagado', money(pagado), Math.round(pagado/total*100)+'% del mes','up'),
    statCard('Pendiente', money(pend), (CONCEPTOS.filter(c=>c.tipo==='gasto'&&c.estado==='pendiente').length)+' conceptos','down'),
  );
  wrap.append(tiles);

  const c = el('div','card');
  const bar = el('div','toolbar'); bar.style.marginBottom='.9rem';
  bar.innerHTML = `<button class="btn ghost sm" id="verAnt">◂ Ver meses anteriores</button>
    <button class="btn" id="cerrar">Cerrar septiembre y abrir octubre 2026</button>`;
  c.append(bar);

  const w = el('div','table-wrap');
  const t = el('table');
  t.innerHTML = `<thead><tr><th>Concepto</th><th>Tipo</th><th>Categoría</th><th>Cuenta</th><th>Recurrente</th><th>Período</th><th class="num">Monto</th><th>Estado</th></tr></thead>`;
  const tb = el('tbody');
  CONCEPTOS.forEach(c2=>{
    const tr=el('tr');
    const st = c2.estado==='pagado'?'good':'warn';
    tr.innerHTML = `
      <td class="t-name">${c2.n}</td>
      <td><span class="badge ${c2.tipo==='ingreso'?'good':'grey'}">${c2.tipo}</span></td>
      <td>${c2.cat}</td>
      <td>${c2.cuenta}</td>
      <td>${c2.rec?`<span class="ico" title="Recurrente">${IC.rec}</span>`:'<span class="t-sub">puntual</span>'}</td>
      <td class="t-sub">sep 2026</td>
      <td class="num">${money(c2.monto,c2.mon)}</td>
      <td><button class="badge ${st} dot toggle-estado">${c2.estado}</button></td>`;
    tb.append(tr);
  });
  t.append(tb); w.append(t); c.append(w);
  c.append(el('p','note',`${IC.info}<span>Al cerrar el mes: los conceptos <strong>recurrentes</strong> se copian a octubre en estado <em>pendiente</em>, los <strong>puntuales</strong> no, y el ahorro de septiembre se suma al acumulado.</span>`));
  wrap.append(c);

  c.querySelectorAll('.toggle-estado').forEach(b=>b.addEventListener('click',()=>{
    const on = b.textContent.trim()==='pendiente';
    b.textContent = on?'pagado':'pendiente';
    b.classList.toggle('good',on); b.classList.toggle('warn',!on);
  }));
  $('#verAnt',c).addEventListener('click',()=>toast('Mockup: histórico de meses cerrados (Fase 2).'));
  $('#cerrar',c).addEventListener('click',()=>toast('Mockup: cierre de mes y armado de octubre 2026 (Fase 2).'));
  return wrap;
};

/* =================== gráficos =================== */
function lineChart(meses, s1, s2){
  const W=620,H=210, pL=54,pR=14,pT=10,pB=26, iw=W-pL-pR, ih=H-pT-pB;
  const all=[...s1,...s2];
  const maxV=Math.ceil(Math.max(...all)/250000)*250000;
  const minV=Math.floor(Math.min(...all)/250000)*250000;
  const x=i=> pL + i*(iw/(meses.length-1));
  const y=v=> pT + ih - ((v-minV)/(maxV-minV))*ih;
  const path=arr=>arr.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');
  const hold=el('div','chart-hold');
  const grid=[0,.25,.5,.75,1].map(f=>{
    const yy=(pT+ih-f*ih).toFixed(1);
    return `<line x1="${pL}" y1="${yy}" x2="${W-pR}" y2="${yy}" stroke="var(--c-grid)" stroke-width="1"/>
      <text x="${pL-8}" y="${+yy+3.5}" text-anchor="end" font-size="9" fill="var(--ink-faint)" font-family="IBM Plex Mono">${nf.format((minV+(maxV-minV)*f)/1000)}k</text>`;
  }).join('');
  const xl=meses.map((m,i)=> i%2 ? '' : `<text x="${x(i).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="9" fill="var(--ink-faint)">${m}</text>`).join('');
  const dots=s1.map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.4" fill="var(--c-ingreso)"/>`).join('');
  const li=s1.length-1;
  hold.innerHTML=`<svg viewBox="0 0 ${W} ${H}" class="chart-svg" role="img" aria-label="Ingresos vs gastos, 12 meses">
    ${grid}${xl}
    <path d="${path(s2)}" fill="none" stroke="var(--c-gasto)" stroke-width="2" stroke-linejoin="round"/>
    <path d="${path(s1)}" fill="none" stroke="var(--c-ingreso)" stroke-width="2" stroke-linejoin="round"/>
    ${dots}
    <circle cx="${x(li).toFixed(1)}" cy="${y(s1[li]).toFixed(1)}" r="3.4" fill="var(--c-ingreso)"/>
    <circle cx="${x(li).toFixed(1)}" cy="${y(s2[li]).toFixed(1)}" r="3.4" fill="var(--c-gasto)"/>
  </svg><div class="tip" id="tip"></div>`;
  const svg=hold.querySelector('svg'), tip=hold.querySelector('#tip');
  svg.addEventListener('mousemove',ev=>{
    const r=svg.getBoundingClientRect();
    let i=Math.round(((ev.clientX-r.left)/r.width*W - pL)/(iw/(meses.length-1)));
    i=Math.max(0,Math.min(meses.length-1,i));
    tip.style.left=(x(i)/W*100)+'%'; tip.style.top=(y(Math.max(s1[i],s2[i]))/H*100)+'%';
    tip.innerHTML=`<strong>${meses[i]} 2026</strong><br>Ingresos <span class="num">${money(s1[i])}</span><br>Gastos <span class="num">${money(s2[i])}</span>`;
    tip.style.opacity='1';
  });
  svg.addEventListener('mouseleave',()=>tip.style.opacity='0');
  return hold;
}

function areaChart(meses, serie, color){
  const W=620,H=210, pL=58,pR=14,pT=10,pB=26, iw=W-pL-pR, ih=H-pT-pB;
  const maxV=Math.ceil(Math.max(...serie)/1000000)*1000000;
  const x=i=> pL + i*(iw/(meses.length-1));
  const y=v=> pT + ih - (v/maxV)*ih;
  const line=serie.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');
  const area=`M${x(0).toFixed(1)} ${y(0).toFixed(1)} `+serie.map((v,i)=>'L'+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ')+` L${x(serie.length-1).toFixed(1)} ${y(0).toFixed(1)} Z`;
  const hold=el('div','chart-hold');
  const grid=[0,.5,1].map(f=>{
    const yy=(pT+ih-f*ih).toFixed(1);
    return `<line x1="${pL}" y1="${yy}" x2="${W-pR}" y2="${yy}" stroke="var(--c-grid)" stroke-width="1"/>
      <text x="${pL-8}" y="${+yy+3.5}" text-anchor="end" font-size="9" fill="var(--ink-faint)" font-family="IBM Plex Mono">${nf.format(maxV*f/1000000)}M</text>`;
  }).join('');
  const xl=meses.map((m,i)=> i%2 ? '' : `<text x="${x(i).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="9" fill="var(--ink-faint)">${m}</text>`).join('');
  const li=serie.length-1;
  hold.innerHTML=`<svg viewBox="0 0 ${W} ${H}" class="chart-svg" role="img" aria-label="Ahorro acumulado, 12 meses">
    ${grid}${xl}
    <path d="${area}" fill="${color}" opacity="0.14"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${x(li).toFixed(1)}" cy="${y(serie[li]).toFixed(1)}" r="3.4" fill="${color}"/>
    <text x="${x(li).toFixed(1)}" y="${y(serie[li])-8}" text-anchor="end" font-size="10" font-family="IBM Plex Mono" fill="var(--ink)">${money(serie[li])}</text>
  </svg>`;
  return hold;
}

/* =================== util =================== */
function bindToast(root,sel,msg){ root.querySelectorAll(sel).forEach(b=>b.addEventListener('click',()=>toast(msg))); }

/* =================== router =================== */
let current='dashboard';
function show(name){
  const app=$('#app'); app.innerHTML=''; app.append(SCREENS[name]());
  document.querySelectorAll('#tabs .tab').forEach(t=>{
    if(t.dataset.screen===name) t.setAttribute('aria-current','page'); else t.removeAttribute('aria-current');
  });
  current=name;
  try{ window.scrollTo({top:0,behavior:'instant'}); }catch(e){ window.scrollTo(0,0); }
}
$('#tabs').addEventListener('click',e=>{ const b=e.target.closest('.tab'); if(b) show(b.dataset.screen); });

const MM=['abril','mayo','junio','julio','agosto','septiembre','octubre'];
let mi=5;
const setM=d=>{ mi=Math.max(0,Math.min(MM.length-1,mi+d)); $('#mLbl').textContent=MM[mi]+' 2026'; toast('Mockup: el histórico por período llega en la Fase 2.'); };
$('#prevM').addEventListener('click',()=>setM(-1));
$('#nextM').addEventListener('click',()=>setM(1));

$('#themeBtn').addEventListener('click',()=>{
  const r=document.documentElement, cur=r.getAttribute('data-theme');
  const sysDark=matchMedia('(prefers-color-scheme:dark)').matches;
  r.setAttribute('data-theme', cur==='dark'?'light':cur==='light'?'dark':(sysDark?'light':'dark'));
});

show('dashboard');
